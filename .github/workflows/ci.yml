# Every job runs on Linux and macOS unless stated otherwise (D-53, CLAUDE.md §7).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: server (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Btrfs for the Linux platform tests
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y btrfs-progs
      - run: uv sync --python 3.11
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
        env:
          BN_PLATFORM_SUDO: ${{ runner.os == 'Linux' && '1' || '' }}

  agent:
    name: agent (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - name: rsync 3 for the end-to-end tests (macOS ships openrsync)
        if: runner.os == 'macOS'
        run: brew install rsync
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  agent-deb:
    name: agent .deb installs and answers ctl info (Debian 12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl
      - run: cargo install cargo-deb --locked
      - working-directory: agent
        run: |
          cargo build --release --target x86_64-unknown-linux-musl
          cargo deb --no-build --target x86_64-unknown-linux-musl
      - name: install in a Debian 12 container
        run: |
          docker run --rm -v "$PWD/agent/target/x86_64-unknown-linux-musl/debian:/pkg" debian:12 sh -ec '
            apt-get update -qq
            apt-get install -y -qq /pkg/*.deb
            test -f /lib/systemd/system/bn-backup-agent@.service
            test -f /usr/share/doc/bn-backup-agent/LICENSE
            bn-backup-agent ctl info
          '

  licenses:
    name: third-party licenses (allowed list, notices up to date)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: cargo install cargo-license --locked
      - run: python3 scripts/third_party_notices.py --check

  integration-linux:
    name: integration (Linux, docker compose)
    needs: [server, agent]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup target add x86_64-unknown-linux-musl && cargo install cargo-deb --locked
      - name: build the .deb and the wheel
        run: |
          mkdir -p dist
          (cd agent && cargo build --release --target x86_64-unknown-linux-musl \
            && cargo deb --no-build --target x86_64-unknown-linux-musl --output ../dist/bn-backup-agent_2.0.0_amd64.deb)
          (cd server && uv build --wheel --out-dir ../dist)
      - run: tests/integration/linux/run.sh

  integration-macos:
    name: integration (macOS runner)
    needs: [server, agent]
    runs-on: macos-14
    # Full Disk Access needs SIP disabled on the runner; until that is confirmed
    # this job reports but does not block (CLAUDE.md §8, docs/open-questions.md Q17).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: build the .pkg (native architecture) and the wheel
        run: |
          mkdir -p dist
          brew install rsync
          packaging/rsync/build-macos-universal.sh "$RUNNER_TEMP/rsync"
          (cd agent && cargo build --release)
          agent/packaging/macos/build-pkg.sh 2.0.0 agent/target/release/bn-backup-agent "$RUNNER_TEMP/rsync" dist
          (cd server && uv build --wheel --out-dir ../dist)
      - run: BN_INTEGRATION_DISPOSABLE=1 tests/integration/macos/run.sh
