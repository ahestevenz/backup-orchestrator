# Vendored upstream files stay byte-for-byte as released.
exclude: ^server/src/bn_backup/vendor/(rrsync|COPYING)$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff-check
        files: ^server/
      - id: ruff-format
        args: [--check]
        files: ^server/

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --manifest-path agent/Cargo.toml --check
        language: system
        files: ^agent/.*\.rs$
        pass_filenames: false
